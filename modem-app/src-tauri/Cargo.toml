[package]
name = "modem-app"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
modemd = { path = "../../crates/modemd" }
serialport = { version = "4.8", default-features = false }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["net", "io-util"] }
