syntax = "proto3";
package modemd.v1;

service Modem {
  rpc GetStatus(Empty) returns (Status);
  rpc GetSettings(Empty) returns (Settings);
  rpc UpdateSettings(UpdateSettingsRequest) returns (Settings);
  rpc ListPorts(Empty) returns (PortList);
  rpc SendSms(SendSmsRequest) returns (Operation);
  rpc SyncSms(Empty) returns (Operation);
  rpc ListSms(ListRequest) returns (SmsList);
  rpc UploadAudio(stream AudioChunk) returns (UploadedAudio);
  rpc MakeCall(MakeCallRequest) returns (Operation);
  rpc HangUp(Empty) returns (Operation);
  rpc ListCalls(ListRequest) returns (CallList);
  rpc CheckBalance(Empty) returns (Operation);
  rpc ListBalanceChecks(ListRequest) returns (BalanceList);
  rpc ExecuteAt(ExecuteAtRequest) returns (ExecuteAtResponse);
  rpc StreamEvents(Empty) returns (stream Event);
}

message Empty {}
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  VALIDATION = 1; DISCONNECTED = 2; SIM_UNAVAILABLE = 3;
  NETWORK_UNAVAILABLE = 4; BUSY = 5; TIMEOUT = 6;
  AMBIGUOUS_DEVICES = 7; UNSUPPORTED_HARDWARE = 8;
}
message Status {
  string service_version = 1;
  string state = 2;
  string port = 3;
  string imei = 4;
  string sim_state = 5;
  string registration = 6;
  string operator = 7;
  int32 signal_rssi = 8;
  string last_error = 9;
  uint32 queued_operations = 10;
}
enum ModemState { MODEM_STATE_UNSPECIFIED = 0; DISCONNECTED_STATE = 1; PORT_BUSY_STATE = 2; INITIALIZING_STATE = 3; READY_STATE = 4; ERROR_STATE = 5; }
message Port { string name = 1; uint32 vid = 2; uint32 pid = 3; string label = 4; bool available = 5; bool dedicated_at = 6; }
message PortList { repeated Port ports = 1; }
message Settings {
  reserved 13;
  reserved "voicemail_guard_seconds";
  uint32 usb_vid = 1; uint32 usb_pid = 2; string port_override = 3;
  uint32 baud = 4; uint32 call_timeout_seconds = 5;
  uint32 upload_pacing_ms = 6; uint32 max_audio_bytes = 7;
  string ussd_code = 8; uint32 ussd_timeout_seconds = 9;
  string currency = 10; double low_balance_threshold = 11;
  string balance_regex = 12;
}
message UpdateSettingsRequest { Settings settings = 1; }
message SendSmsRequest { string destination = 1; string body = 2; }
message MakeCallRequest { string destination = 1; string audio_id = 2; }
message ExecuteAtRequest { string command = 1; }
message ExecuteAtResponse { repeated string lines = 1; }
message Operation { string id = 1; string state = 2; }
message ListRequest { uint32 limit = 1; string cursor = 2; }
message Sms { string id = 1; string direction = 2; string peer = 3; string body = 4; string state = 5; int64 created_at_ms = 6; string message_reference = 7; string cause = 8; string kind = 9; string source = 10; string storage = 11; int32 storage_index = 12; string modem_status = 13; string modem_timestamp = 14; string encoding = 15; int32 dcs = 16; int32 length = 17; string service_center = 18; string delivery_status = 19; int64 synchronized_at_ms = 20; bool present_on_modem = 21; }
message SmsList { repeated Sms records = 1; string next_cursor = 2; }
enum AnswerClassification {
  reserved 1, 2, 3;
  reserved "INFERRED_HUMAN", "FORWARDED", "NO_ANSWER";
  ANSWER_CLASSIFICATION_UNKNOWN = 0; ANSWERED = 4; NOT_ANSWERED = 5;
}
enum EndReason {
  reserved 2, 4, 5;
  reserved "REMOTE_OR_NETWORK_HANG_UP", "NETWORK_NO_ANSWER", "ALERT_TIMEOUT";
  END_REASON_NONE = 0; LOCAL_HANG_UP = 1; BUSY_END = 3; MODEM_LOST = 6; CALL_ERROR = 7;
  REMOTE_HANG_UP = 8; NO_ANSWER_END = 9; UNREACHABLE = 10; NETWORK_ERROR = 11; SIGNALING_TIMEOUT = 12;
}
message Call { reserved 10; reserved "forwarding_notification_seen"; string id = 1; string peer = 2; string state = 3; int64 created_at_ms = 4; string error = 5; uint32 duration_seconds = 6; string audio_id = 7; AnswerClassification answer_classification = 8; EndReason end_reason = 9; int64 connected_at_ms = 11; int64 ended_at_ms = 12; string release_cause = 13; }
message CallList { repeated Call records = 1; string next_cursor = 2; }
message BalanceCheck { string id = 1; string raw = 2; double value = 3; string currency = 4; int64 created_at_ms = 5; bool parsed = 6; string error = 7; string sms_id = 8; }
message BalanceList { repeated BalanceCheck records = 1; string next_cursor = 2; }
message AudioChunk { string name = 1; bytes data = 2; }
message UploadedAudio { string id = 1; uint64 size = 2; string format = 3; string module_path = 4; }
message Event {
  string id = 1; int64 created_at_ms = 2;
  oneof payload {
    ModemStateEvent modem_state = 10; SmsEvent sms = 11; CallEvent call = 12;
    BalanceWarningEvent balance_warning = 13; OperationFailureEvent operation_failure = 14;
  }
}
message ModemStateEvent { string state = 1; string port = 2; string guidance = 3; }
message SmsEvent { string record_id = 1; string state = 2; string cause = 3; }
message CallEvent { reserved 6; reserved "forwarding_notification_seen"; string record_id = 1; string state = 2; string cause = 3; AnswerClassification answer_classification = 4; EndReason end_reason = 5; int64 connected_at_ms = 7; int64 ended_at_ms = 8; string release_cause = 9; }
message BalanceWarningEvent { string record_id = 1; double value = 2; string currency = 3; double threshold = 4; }
message OperationFailureEvent { string operation_id = 1; ErrorCode code = 2; string message = 3; }
